<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>핵심 정리</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <div class="title-row">
      <div class="page-title" id="pageTitle">-</div>
      <span class="version" id="versionLabel"></span>
    </div>
    <div class="actions">
      <button id="runBtn" type="button">이 페이지 요약</button>
      <button id="copyBtn" type="button" disabled>복사</button>
      <button id="updateBtn" type="button">플러그인 업데이트<span id="updateBadge" class="badge" hidden></span></button>
    </div>
  </header>
  <div id="status" class="status"></div>
  <main id="result" class="result md"></main>
  <footer id="meta" class="meta"></footer>
  <section id="thread" class="thread"></section>
  <form id="askForm" class="composer" hidden>
    <textarea id="askInput" rows="1" placeholder="이 페이지에 대해 더 물어보기"></textarea>
    <button id="askBtn" type="submit">보내기</button>
  </form>
  <script src="markdown.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
